name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main への push は取り消さず、PR だけ新しい push で古い実行を取り消す
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Gradle 6.9.1 は Java 16 以上で動かないため JDK 8 を使う（#8 で上げる）
  JAVA_VERSION: "8"
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"

jobs:
  build:
    name: Build and unit tests
    # public リポジトリで無料なのは標準のランナーだけ（larger runner は課金される）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and unit tests
        run: ./gradlew buildContracts build -x :ftgo-end-to-end-tests:test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  e2e:
    name: End-to-end tests and image scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # gradle-docker-compose-plugin 0.15.2 は単体の docker-compose コマンドを呼ぶ
      - name: Provide docker-compose command
        run: |
          if ! command -v docker-compose >/dev/null; then
            printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
            sudo chmod +x /usr/local/bin/docker-compose
          fi
          docker-compose version

      - name: Start services
        id: start
        run: ./gradlew buildContracts :composeUp

      - name: End-to-end tests
        run: ./run-end-to-end-tests.sh

      # スキャン対象は、起動したコンテナが実際に使ったイメージ（作業フォルダ名に左右されない）
      - name: Record images used
        if: always() && steps.start.outcome != 'skipped'
        run: |
          mkdir -p build/trivy
          docker ps -a --format '{{.Image}}' | sort -u > build/trivy/images.txt
          cat build/trivy/images.txt

      - name: Collect container logs
        if: failure()
        run: |
          mkdir -p build/container-logs
          for c in $(docker ps -a --format '{{.Names}}'); do docker logs "$c" > "build/container-logs/$c.log" 2>&1 || true; done

      - name: Stop services
        if: always() && steps.start.outcome != 'skipped'
        run: ./gradlew :composeDown

      - name: Install trivy
        if: always() && steps.start.outcome != 'skipped'
        run: |
          curl -fsSLo trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # 今は既知の脆弱性が多いため、件数を記録するだけで失敗にはしない（#13 で見直す）
      - name: Scan images
        if: always() && steps.start.outcome != 'skipped'
        continue-on-error: true
        run: |
          {
            echo "## Image scan (trivy ${TRIVY_VERSION})"
            echo
            echo "| Image | Critical | High | Medium | Low |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r image; do
            out="build/trivy/$(echo "$image" | tr '/:' '__').json"
            if trivy image --quiet --timeout 10m --image-src docker --scanners vuln --format json -o "$out" "$image"; then
              jq -r --arg image "$image" '
                [.Results[]?.Vulnerabilities[]?.Severity] as $s
                | "| \($image) | \([$s[] | select(. == "CRITICAL")] | length) | \([$s[] | select(. == "HIGH")] | length) | \([$s[] | select(. == "MEDIUM")] | length) | \([$s[] | select(. == "LOW")] | length) |"
              ' "$out" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| ${image} | scan failed | | | |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < build/trivy/images.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            ftgo-end-to-end-tests/build/reports/tests/
            build/trivy/
            build/container-logs/
          if-no-files-found: ignore
          retention-days: 7
